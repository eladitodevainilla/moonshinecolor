name: Build Moonshine Voice Color VST3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate CMakeLists.txt
        id: locate
        shell: pwsh
        run: |
          $cmake = Get-ChildItem -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
          if (-not $cmake) {
            $zip = Get-ChildItem -Recurse -Filter "*.zip" | Select-Object -First 1
            if ($zip) {
              Expand-Archive -Path $zip.FullName -DestinationPath "extracted" -Force
              $cmake = Get-ChildItem -Path "extracted" -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
            }
          }
          if (-not $cmake) {
            Write-Error "No se encontro CMakeLists.txt ni el ZIP en el repositorio."
            exit 1
          }
          echo "src_dir=$($cmake.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -S "${{ steps.locate.outputs.src_dir }}" -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target MoonshineVoiceColor_VST3 --parallel

      - name: Package VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonshine-Voice-Color-VST3-Windows
          path: build/MoonshineVoiceColor_artefacts/Release/VST3/Moonshine Voice Color.vst3
          retention-days: 90
